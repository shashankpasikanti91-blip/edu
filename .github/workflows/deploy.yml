name: Deploy SRP Education AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────
  # 1. Build & type-check frontend
  # ──────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Type-check & build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://edu.srpailabs.com/api/v1
        run: npm run build

  # ──────────────────────────────────────────────
  # 2. Type-check backend
  # ──────────────────────────────────────────────
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Type-check
        working-directory: backend
        run: npx tsc --noEmit

  # ──────────────────────────────────────────────
  # 3. Deploy to VPS (only if both builds pass)
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /var/www/srp-edu

            echo "▶ Pulling latest code..."
            git pull origin main

            echo "▶ Rebuilding containers (no cache for clean build)..."
            docker compose -f docker-compose.prod.yml build --no-cache

            echo "▶ Stopping old containers..."
            docker compose -f docker-compose.prod.yml down --remove-orphans

            echo "▶ Starting new containers..."
            docker compose -f docker-compose.prod.yml up -d

            echo "▶ Running database migrations..."
            docker exec edu-backend npx prisma migrate deploy

            echo "▶ Pruning dangling images..."
            docker image prune -f

            echo "✅ Deployment complete!"
